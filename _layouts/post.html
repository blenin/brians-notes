---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-date">{{ page.date | date: "%-d de %B de %Y" }}</p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">← Volver a todas las notas</a></p>
</article>
